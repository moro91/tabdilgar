<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تبدیلگر هوشمند | پیشرفته و کاربردی</title>
  <style>
    :root {
      --bg-main: #fdfbf7;
      --bg-card: #ffffff;
      --primary: #5c3a21;
      --primary-hover: #422815;
      --secondary: #8c5a35;
      --cream-light: #f5efe6;
      --cream-medium: #e8dccb;
      --accent-gold: #d4a373;
      --text-dark: #2b1e16;
      --text-muted: #6e5d4f;
      --border-color: #dfd0be;
      --success: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-dark); padding: 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .container { width: 100%; max-width: 620px; background: var(--bg-card); border-radius: 20px; border: 2px solid var(--border-color); box-shadow: 0 10px 25px rgba(92,58,33,0.1); overflow: hidden; }
    
    .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; padding: 20px; text-align: center; }
    .header h1 { font-size: 24px; margin-bottom: 5px; color: var(--cream-light); }
    .header p { font-size: 13px; opacity: 0.9; }

    .nav-tabs { display: flex; background: var(--cream-medium); padding: 6px; gap: 6px; border-bottom: 1px solid var(--border-color); overflow-x: auto; }
    .tab-btn { flex: 1; min-width: 90px; padding: 10px 5px; border: none; background: transparent; color: var(--text-dark); font-weight: bold; font-size: 13px; border-radius: 10px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

    .content-section { display: none; padding: 20px; animation: fadeIn 0.2s ease-in-out; }
    .content-section.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: var(--text-muted); }
    
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 15px; background: var(--bg-main); color: var(--text-dark); text-align: center; outline: none; transition: 0.2s; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(92,58,33,0.15); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .result-wrapper { position: relative; margin-top: 5px; }
    .result-box { background: var(--cream-light); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 35px 12px 12px; text-align: center; font-size: 17px; font-weight: bold; color: var(--primary); min-height: 48px; word-break: break-word; display: flex; align-items: center; justify-content: center; }
    
    .copy-btn { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); background: var(--cream-medium); border: none; color: var(--primary); border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .copy-btn:hover { background: var(--accent-gold); }

    .rate-info { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 8px; font-weight: bold; }
    .rate-edit-toggle { font-size: 11px; color: var(--secondary); text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 4px; }

    /* ماشین حساب */
    .calc-screen-container { position: relative; margin-bottom: 12px; }
    #calcScreen { font-size: 22px; text-align: right; dir: ltr; direction: ltr; font-family: monospace; background: #fff; padding-left: 10px; }
    .calc-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .btn { padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--cream-light); color: var(--primary); font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.1s; user-select: none; }
    .btn:active { transform: scale(0.97); background: var(--cream-medium); }
    .btn-op { background: var(--cream-medium); color: var(--primary); }
    .btn-action { background: var(--primary); color: #fff; grid-column: span 1; }
    .btn-action:hover { background: var(--primary-hover); }
    .btn-clear { background: #e57373; color: #fff; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>تبدیلگر هوشمند</h1>
      <p>مبدل جامع اعداد، ارزها، تخفیف و ماشین حساب</p>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('num', event)">تبدیل اعداد</button>
      <button class="tab-btn" onclick="switchTab('curr', event)">تبدیل ارز</button>
      <button class="tab-btn" onclick="switchTab('disc', event)">تخفیف و درصد</button>
      <button class="tab-btn" onclick="switchTab('calc', event)">ماشین حساب</button>
    </div>

    <!-- 1. بخش تبدیل اعداد -->
    <div id="sec-num" class="content-section active">
      <div class="form-group">
        <label>ورودی (عدد فارسی/انگلیسی یا متن):</label>
        <input type="text" id="numInput" placeholder="مثلاً: 1250000 یا ۱۲۵ یا دوازده" oninput="convertNumber()">
      </div>
      <div class="grid-2">
        <div>
          <label>ارقام انگلیسی:</label>
          <div class="result-wrapper">
            <div class="result-box" id="resEnDigits">-</div>
            <button class="copy-btn" onclick="copyResult('resEnDigits')">کپی</button>
          </div>
        </div>
        <div>
          <label>ارقام فارسی:</label>
          <div class="result-wrapper">
            <div class="result-box" id="resFaDigits">-</div>
            <button class="copy-btn" onclick="copyResult('resFaDigits')">کپی</button>
          </div>
        </div>
      </div>
      <div style="margin-top:12px;">
        <label>حروف فارسی:</label>
        <div class="result-wrapper">
          <div class="result-box" id="resFaWords">-</div>
          <button class="copy-btn" onclick="copyResult('resFaWords')">کپی</button>
        </div>
      </div>
      <div style="margin-top:12px;">
        <label>حروف انگلیسی:</label>
        <div class="result-wrapper">
          <div class="result-box" id="resEnWords">-</div>
          <button class="copy-btn" onclick="copyResult('resEnWords')">کپی</button>
        </div>
      </div>
    </div>

    <!-- 2. بخش تبدیل ارز -->
    <div id="sec-curr" class="content-section">
      <div class="form-group">
        <label>مقدار:</label>
        <input type="number" id="currAmount" value="1" step="any" oninput="calcCurrency()">
      </div>
      <div class="grid-2">
        <div>
          <label>از ارز:</label>
          <select id="currFrom" onchange="calcCurrency()">
            <option value="USD">دلار آمریکا (USD)</option>
            <option value="OMR" selected>ریال عمان (OMR)</option>
            <option value="TRY">لیر ترکیه (TRY)</option>
            <option value="GBP">پوند انگلیس (GBP)</option>
            <option value="IRT">تومان ایران (IRT)</option>
            <option value="IRR">ریال ایران (IRR)</option>
          </select>
        </div>
        <div>
          <label>به ارز:</label>
          <select id="currTo" onchange="calcCurrency()">
            <option value="USD">دلار آمریکا (USD)</option>
            <option value="OMR">ریال عمان (OMR)</option>
            <option value="TRY" selected>لیر ترکیه (TRY)</option>
            <option value="GBP">پوند انگلیس (GBP)</option>
            <option value="IRT">تومان ایران (IRT)</option>
            <option value="IRR">ریال ایران (IRR)</option>
          </select>
        </div>
      </div>
      
      <div style="margin-top:15px;">
        <label>نتیجه تبدیل:</label>
        <div class="result-wrapper">
          <div class="result-box" id="currResult">-</div>
          <button class="copy-btn" onclick="copyResult('currResult')">کپی</button>
        </div>
      </div>
      <div class="rate-info" id="rateRateInfo">--</div>

      <div style="text-align:center; margin-top:8px;">
        <span class="rate-edit-toggle" onclick="toggleRateEdit()">تنظیم/ویرایش دستی نرخ‌های ارز</span>
      </div>

      <div id="rateEditBox" style="display:none; margin-top:15px; background:var(--cream-light); padding:12px; border-radius:10px; border:1px solid var(--border-color);">
        <label style="text-align:center; margin-bottom:8px;">نرخ مبنا (نسبت به ۱ دلار آمریکا):</label>
        <div class="grid-2" style="font-size:12px;">
          <div><label>ریال عمان (OMR):</label><input type="number" step="any" id="rate_OMR" oninput="updateCustomRates()"></div>
          <div><label>لیر ترکیه (TRY):</label><input type="number" step="any" id="rate_TRY" oninput="updateCustomRates()"></div>
          <div><label>پوند انگلیس (GBP):</label><input type="number" step="any" id="rate_GBP" oninput="updateCustomRates()"></div>
          <div><label>تومان ایران (IRT):</label><input type="number" step="any" id="rate_IRT" oninput="updateCustomRates()"></div>
        </div>
      </div>
    </div>

    <!-- 3. بخش تخفیف -->
    <div id="sec-disc" class="content-section">
      <div class="form-group">
        <label>قیمت اصلی:</label>
        <input type="number" id="discPrice" placeholder="مثلاً 1000000" oninput="calcDiscount()">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>درصد تخفیف (%):</label>
          <input type="number" id="discPercent" placeholder="مثلاً 20" oninput="calcDiscount()">
        </div>
        <div class="form-group">
          <label>مالیات / ارزش افزوده (%):</label>
          <input type="number" id="taxPercent" placeholder="مثلاً 10" oninput="calcDiscount()">
        </div>
      </div>
      <div class="grid-2" style="margin-top:10px;">
        <div>
          <label>مبلغ تخفیف:</label>
          <div class="result-wrapper">
            <div class="result-box" id="discAmount">-</div>
            <button class="copy-btn" onclick="copyResult('discAmount')">کپی</button>
          </div>
        </div>
        <div>
          <label>قیمت نهایی قابل پرداخت:</label>
          <div class="result-wrapper">
            <div class="result-box" id="finalPrice">-</div>
            <button class="copy-btn" onclick="copyResult('finalPrice')">کپی</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. ماشین حساب -->
    <div id="sec-calc" class="content-section">
      <div class="calc-screen-container">
        <input type="text" id="calcScreen" readonly placeholder="0">
      </div>
      <div class="calc-btn-grid">
        <button class="btn btn-clear" onclick="pressCalc('C')">C</button>
        <button class="btn btn-op" onclick="pressCalc('back')">⌫</button>
        <button class="btn btn-op" onclick="pressCalc('%')">%</button>
        <button class="btn btn-op" onclick="pressCalc('/')">÷</button>

        <button class="btn" onclick="pressCalc('7')">7</button>
        <button class="btn" onclick="pressCalc('8')">8</button>
        <button class="btn" onclick="pressCalc('9')">9</button>
        <button class="btn btn-op" onclick="pressCalc('*')">×</button>

        <button class="btn" onclick="pressCalc('4')">4</button>
        <button class="btn" onclick="pressCalc('5')">5</button>
        <button class="btn" onclick="pressCalc('6')">6</button>
        <button class="btn btn-op" onclick="pressCalc('-')">-</button>

        <button class="btn" onclick="pressCalc('1')">1</button>
        <button class="btn" onclick="pressCalc('2')">2</button>
        <button class="btn" onclick="pressCalc('3')">3</button>
        <button class="btn btn-op" onclick="pressCalc('+')">+</button>

        <button class="btn" onclick="pressCalc('0')">0</button>
        <button class="btn" onclick="pressCalc('.')">.</button>
        <button class="btn btn-op" onclick="pressCalc('(')">(</button>
        <button class="btn btn-action" onclick="pressCalc('=')">=</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">کپی شد!</div>

  <script>
    // اعلان پیام تعاملی کپی
    function copyResult(elemId) {
      const text = document.getElementById(elemId).innerText;
      if (!text || text === '-') return;
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      });
    }

    // تغییر زبانه
    function switchTab(name, evt) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
      evt.currentTarget.classList.add('active');
      document.getElementById('sec-' + name).classList.add('active');
    }

    // --- 1. بخش تبدیل عدد به ارقام و حروف کامل ---
    const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    const faWordsSimple = {'صفر':0,'یک':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'هفت':7,'هشت':8,'نه':9,'ده':10,'یازده':11,'دوازده':12,'سیزده':13,'چهارده':14,'پانزده':15,'شانزده':16,'هفده':17,'هجده':18,'نوزده':19,'بیست':20,'سی':30,'چهل':40,'پنجاه':50,'شصت':60,'هفتاد':70,'هشتاد':80,'نود':90,'صد':100,'هزار':1000,'میلیون':1000000};
    const enWordsSimple = {'zero':0,'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,'sixteen':16,'seventeen':17,'eighteen':18,'nineteen':19,'twenty':20,'thirty':30,'forty':40,'fifty':50,'sixty':60,'seventy':70,'eighty':80,'ninety':90,'hundred':100,'thousand':1000,'million':1000000};

    function numToPersianWords(n) {
      if (isNaN(n)) return 'عدد نامعتبر';
      if (n === 0) return 'صفر';
      if (n < 0) return 'منفی ' + numToPersianWords(Math.abs(n));

      const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
      const dahgan = ['', 'ده', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
      const dahAft = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
      const sadgan = ['', 'صد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
      const stages = ['', 'هزار', 'میلیون', 'میلیارد', 'تریلیون'];

      function convertThree(num) {
        let res = [];
        let sad = Math.floor(num / 100);
        let rem = num % 100;
        let dah = Math.floor(rem / 10);
        let yek = rem % 10;

        if (sad > 0) res.push(sadgan[sad]);
        if (rem >= 10 && rem < 20) {
          res.push(dahAft[rem - 10]);
        } else {
          if (dah > 0) res.push(dahgan[dah]);
          if (yek > 0) res.push(yekan[yek]);
        }
        return res.join(' و ');
      }

      let parts = n.toString().split('.');
      let intPart = parseInt(parts[0], 10);
      let decPart = parts[1];

      let words = [];
      let i = 0;
      let temp = intPart;

      if (temp === 0) words.push('صفر');
      else {
        while (temp > 0) {
          let chunk = temp % 1000;
          if (chunk > 0) {
            let chunkW = convertThree(chunk);
            let stg = stages[i];
            words.unshift(stg ? chunkW + ' ' + stg : chunkW);
          }
          temp = Math.floor(temp / 1000);
          i++;
        }
      }

      let result = words.join(' و ');
      if (decPart && parseInt(decPart, 10) > 0) {
        result += ' ممیز ' + numToPersianWords(parseInt(decPart, 10));
      }
      return result;
    }

    function numToEnglishWords(n) {
      if (isNaN(n)) return 'Invalid Number';
      if (n === 0) return 'zero';
      if (n < 0) return 'minus ' + numToEnglishWords(Math.abs(n));

      const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
      const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
      const scales = ['', 'thousand', 'million', 'billion', 'trillion'];

      function convertThree(num) {
        let res = [];
        if (num >= 100) {
          res.push(ones[Math.floor(num / 100)] + ' hundred');
          num %= 100;
        }
        if (num >= 20) {
          let t = tens[Math.floor(num / 10)];
          let o = ones[num % 10];
          res.push(o ? t + '-' + o : t);
        } else if (num > 0) {
          res.push(ones[num]);
        }
        return res.join(' ');
      }

      let parts = n.toString().split('.');
      let intPart = parseInt(parts[0], 10);
      let decPart = parts[1];

      let words = [];
      let i = 0;
      let temp = intPart;

      if (temp === 0) words.push('zero');
      else {
        while (temp > 0) {
          let chunk = temp % 1000;
          if (chunk > 0) {
            let chunkW = convertThree(chunk);
            let sc = scales[i];
            words.unshift(sc ? chunkW + ' ' + sc : chunkW);
          }
          temp = Math.floor(temp / 1000);
          i++;
        }
      }

      let result = words.join(', ');
      if (decPart && parseInt(decPart, 10) > 0) {
        result += ' point ' + numToEnglishWords(parseInt(decPart, 10));
      }
      return result;
    }

    function convertNumber() {
      let rawVal = document.getElementById('numInput').value.trim().toLowerCase();
      if (!rawVal) {
        document.getElementById('resEnDigits').innerText = '-';
        document.getElementById('resFaDigits').innerText = '-';
        document.getElementById('resFaWords').innerText = '-';
        document.getElementById('resEnWords').innerText = '-';
        return;
      }

      // نرمال‌سازی ارقام فارسی و عربی به انگلیسی
      let normVal = rawVal.replace(/[۰-۹]/g, d => faDigits.indexOf(d))
                          .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

      let num = parseFloat(normVal);

      // بررسی کلیدهای متنی
      if (isNaN(num)) {
        if (faWordsSimple[rawVal] !== undefined) num = faWordsSimple[rawVal];
        if (enWordsSimple[rawVal] !== undefined) num = enWordsSimple[rawVal];
      }

      if (!isNaN(num)) {
        let strNum = num.toLocaleString('en-US');
        document.getElementById('resEnDigits').innerText = strNum;
        document.getElementById('resFaDigits').innerText = strNum.replace(/\d/g, d => faDigits[d]);
        document.getElementById('resFaWords').innerText = numToPersianWords(num);
        document.getElementById('resEnWords').innerText = numToEnglishWords(num);
      } else {
        document.getElementById('resEnDigits').innerText = rawVal;
        document.getElementById('resFaDigits').innerText = rawVal.replace(/\d/g, d => faDigits[d]);
        document.getElementById('resFaWords').innerText = 'متن شناسایی نشد';
        document.getElementById('resEnWords').innerText = 'Unrecognized Text';
      }
    }


    // --- 2. بخش تبدیل ارز با نرخ‌های دقیق ---
    // نرخ‌های واقعی بر پایه ۱ دلار آمریکا (USD)
    let rates = {
      USD: 1,
      OMR: 0.3845,   // ۱ ریال عمان ≈ ۲.۶۰ دلار
      GBP: 0.7565,   // ۱ پوند ≈ ۱.۳۲ دلار
      TRY: 49.15,    // ۱ دلار ≈ ۴۹.۱۵ لیر
      IRT: 60000,    // ۱ دلار ≈ ۶۰,۰۰۰ تومان (قابل تنظیم)
      IRR: 600000    // ۱ دلار ≈ ۶۰۰,۰۰۰ ریال
    };

    function initRateInputs() {
      document.getElementById('rate_OMR').value = rates.OMR;
      document.getElementById('rate_TRY').value = rates.TRY;
      document.getElementById('rate_GBP').value = rates.GBP;
      document.getElementById('rate_IRT').value = rates.IRT;
    }

    function toggleRateEdit() {
      let box = document.getElementById('rateEditBox');
      box.style.display = (box.style.display === 'none') ? 'block' : 'none';
    }

    function updateCustomRates() {
      rates.OMR = parseFloat(document.getElementById('rate_OMR').value) || rates.OMR;
      rates.TRY = parseFloat(document.getElementById('rate_TRY').value) || rates.TRY;
      rates.GBP = parseFloat(document.getElementById('rate_GBP').value) || rates.GBP;
      rates.IRT = parseFloat(document.getElementById('rate_IRT').value) || rates.IRT;
      rates.IRR = rates.IRT * 10;
      calcCurrency();
    }

    function calcCurrency() {
      let amt = parseFloat(document.getElementById('currAmount').value) || 0;
      let from = document.getElementById('currFrom').value;
      let to = document.getElementById('currTo').value;

      let inUSD = amt / rates[from];
      let res = inUSD * rates[to];

      // فرمت‌دهی اعشار بر اساس نوع ارز
      let decimals = (to === 'OMR' || to === 'GBP') ? 3 : (to === 'IRT' || to === 'IRR' ? 0 : 2);
      
      let formattedRes = res.toLocaleString('fa-IR', { maximumFractionDigits: decimals });
      document.getElementById('currResult').innerText = formattedRes + ' ' + to;

      // نمایش نرخ معادل ۱ واحد
      let singleUnitInUSD = 1 / rates[from];
      let singleUnitConverted = singleUnitInUSD * rates[to];
      document.getElementById('rateRateInfo').innerText = `۱ ${from} = ${singleUnitConverted.toLocaleString('fa-IR', { maximumFractionDigits: decimals })} ${to}`;
    }


    // --- 3. بخش تخفیف و درصد ---
    function calcDiscount() {
      let price = parseFloat(document.getElementById('discPrice').value) || 0;
      let discPct = parseFloat(document.getElementById('discPercent').value) || 0;
      let taxPct = parseFloat(document.getElementById('taxPercent').value) || 0;

      let discAmount = (price * discPct) / 100;
      let afterDisc = price - discAmount;
      let taxAmount = (afterDisc * taxPct) / 100;
      let finalPrice = afterDisc + taxAmount;

      document.getElementById('discAmount').innerText = discAmount.toLocaleString('fa-IR');
      document.getElementById('finalPrice').innerText = finalPrice.toLocaleString('fa-IR');
    }


    // --- 4. ماشین حساب امن و کاربردی ---
    let calcExpr = '';

    function pressCalc(v) {
      let screen = document.getElementById('calcScreen');

      if (v === 'C') {
        calcExpr = '';
      } else if (v === 'back') {
        calcExpr = calcExpr.slice(0, -1);
      } else if (v === '=') {
        if (!calcExpr) return;
        try {
          // جایگزینی امن درصد و عملگرها
          let evalExpr = calcExpr.replace(/×/g, '*').replace(/÷/g, '/');
          evalExpr = evalExpr.replace(/(\d+(\.\d+)?)%/g, '($1/100)');
          
          let result = Function('"use strict";return (' + evalExpr + ')')();
          calcExpr = Number.isInteger(result) ? result.toString() : result.toFixed(4).replace(/\.?0+$/, '');
        } catch {
          calcExpr = 'خطا';
        }
      } else {
        if (calcExpr === 'خطا') calcExpr = '';
        calcExpr += v;
      }
      screen.value = calcExpr;
    }

    // مقداردهی اولیه
    window.onload = function() {
      initRateInputs();
      calcCurrency();
    };
  </script>
</body>
</html>
